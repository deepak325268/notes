<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Notes</title>
    <!-- Quill Editor CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📚 My Notes</h2>
            <button class="mobile-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search notes..." oninput="handleSearch()">
        </div>

        <div class="sidebar-menu" id="bookList">
            <!-- Books will be loaded here dynamically -->
        </div>

        <div class="sidebar-footer">
            <button onclick="addNewCategory()" class="btn-primary" style="background-color: #2b2d42;"><i class="fas fa-folder-plus"></i> Add Category / Subject</button>
            <div class="backup-options">
                <button onclick="exportBackup()"><i class="fas fa-download"></i> Export</button>
                <label for="importFile" class="btn-import"><i class="fas fa-upload"></i> Import</label>
                <input type="file" id="importFile" accept=".json" onchange="importBackup(event)" style="display: none;">
            </div>
            <button onclick="showAutoBackups()" style="width:100%; margin-top:10px; padding:8px; background:#eef2ff; border:1px solid #4361ee; color:#4361ee; border-radius:5px; cursor:pointer; font-weight:bold;"><i class="fas fa-history"></i> Cloud History</button>
        </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="top-bar">
            <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="breadcrumb" id="breadcrumb">
                Welcome! Select or create a book.
            </div>
            <div class="save-status" id="saveStatus">☁️ Saved</div>
        </div>

        <!-- Dynamic Content Area -->
        <div id="contentArea" class="content-area">
            <div class="welcome-screen">
                <h2>Welcome to your Book Notes</h2>
                <p>Click "+ Add Book" in the sidebar to get started.</p>
            </div>
        </div>
    </div>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Quill Editor JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
